<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product — Apexcify</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script defer src="/frontend/js/api.js"></script>
  <script defer src="/frontend/js/product.js"></script>
</head>
<body class="min-h-screen bg-base-100">
  <div class="navbar bg-base-100 shadow">
    <a href="/" class="btn btn-ghost text-xl font-bold">🛍️ Apexcify</a>
    <a href="/frontend/pages/cart.html" class="ml-auto btn btn-ghost">Cart <span id="cartCount" class="badge badge-primary ml-2">0</span></a>
  </div>
  <main class="container mx-auto p-6">
    <div id="productDetail" class="grid gap-10 lg:grid-cols-2"></div>
    <section class="mt-10">
      <h3 class="text-xl font-semibold mb-3">Customer Reviews</h3>
      <div id="reviews" class="space-y-3"></div>
      <div id="reviewForm" class="mt-4 hidden">
        <textarea id="reviewComment" class="textarea textarea-bordered w-full" placeholder="Your review..."></textarea>
        <div class="mt-2 flex items-center gap-2">
          <input id="reviewRating" type="number" min="1" max="5" class="input input-bordered w-24" value="5" />
          <button id="submitReview" class="btn btn-primary">Submit</button>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
