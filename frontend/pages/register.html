<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register — Apexcify</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet">
  <script defer src="/frontend/js/api.js"></script>
  <script defer src="/frontend/js/register.js"></script>
</head>
<body class="min-h-screen grid place-items-center bg-gradient-to-b from-base-200 to-base-100">
  <div class="card w-full max-w-md bg-base-100 shadow-2xl">
    <div class="card-body space-y-2">
      <h2 class="card-title">Create your account</h2>
      <input id="name" type="text" placeholder="Name" class="input input-bordered w-full" />
      <input id="email" type="email" placeholder="Email" class="input input-bordered w-full" />
      <input id="password" type="password" placeholder="Password" class="input input-bordered w-full" />
      <select id="role" class="select select-bordered w-full">
        <option value="customer">Customer</option>
        <option value="vendor">Vendor</option>
      </select>
      <button id="registerBtn" class="btn btn-primary w-full mt-2">Register</button>
      <p class="text-sm">Already have an account? <a href="/frontend/pages/login.html" class="link link-primary">Sign in</a></p>
    </div>
  </div>
</body>
</html>
