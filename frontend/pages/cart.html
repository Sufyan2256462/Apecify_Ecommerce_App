<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cart — Apexcify</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet">
  <script defer src="/frontend/js/api.js"></script>
  <script defer src="/frontend/js/cart.js"></script>
</head>
<body class="min-h-screen bg-base-100">
  <div class="navbar bg-base-100 shadow">
    <a href="/" class="btn btn-ghost text-xl font-bold">🛍️ Apexcify</a>
  </div>
  <main class="container mx-auto p-6">
    <h2 class="text-2xl font-bold mb-4">Your Cart</h2>
    <div id="cartItems" class="space-y-3"></div>
    <div class="mt-6 card bg-base-100 shadow p-4 flex items-center justify-between">
      <div class="text-lg">Total: <span id="total" class="font-bold">$0.00</span></div>
      <a href="/frontend/pages/checkout.html" class="btn btn-primary">Checkout</a>
    </div>
  </main>
</body>
</html>
