<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vendor — Apexcify</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet">
  <script defer src="/frontend/js/api.js"></script>
  <script defer src="/frontend/js/vendor.js"></script>
</head>
<body class="min-h-screen bg-base-100">
  <div class="navbar bg-base-100 shadow">
    <a href="/" class="btn btn-ghost text-xl font-bold">🛍️ Vendor Panel</a>
    <button id="logout" class="ml-auto btn btn-ghost">Logout</button>
  </div>
  <main class="container mx-auto p-6">
    <div class="grid lg:grid-cols-2 gap-6">
      <form id="createForm" class="card bg-base-100 shadow p-4">
        <h3 class="font-semibold mb-2">Create Product</h3>
        <input name="title" placeholder="Title" class="input input-bordered w-full mb-2"/>
        <input name="price" placeholder="Price" type="number" class="input input-bordered w-full mb-2"/>
        <input name="stock" placeholder="Stock" type="number" class="input input-bordered w-full mb-2"/>
        <textarea name="description" placeholder="Description" class="textarea textarea-bordered w-full mb-2"></textarea>
        <input name="image" placeholder="Image URL" class="input input-bordered w-full mb-2"/>
        <button class="btn btn-primary w-full">Create</button>
      </form>
      <div class="card bg-base-100 shadow p-4">
        <h3 class="font-semibold mb-2">Your Products</h3>
        <div id="myProducts" class="space-y-3"></div>
      </div>
    </div>
    
    <!-- Product deletion functionality added - no vendor account deletion -->
  </main>
</body>
</html>
